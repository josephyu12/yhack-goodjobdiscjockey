<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #fff;
    }
    h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 10px;
    }
    .status {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }
    .status.ready { color: #4ade80; }
    .status.empty { color: #f87171; }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Good Job Disc Jockey</h1>
  <p class="status" id="status">Checking...</p>
  <p class="hint" id="hint"></p>
  <script src="popup.js"></script>
</body>
</html>
